<!doctype html>
<html lang="en" data-lang="en" data-theme="page">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Decide the display language before first paint (avoids a flash of the
		     wrong one). An explicit choice from this tab session (sessionStorage,
		     cleared on tab close) always wins; otherwise fall back to the
		     browser's own language. Mirrored in lib/state/lang.svelte.ts's
		     restore() — keep the two in sync. -->
		<script>
			try {
				var savedLang = sessionStorage.getItem('august-lang');
				var browserLang = (navigator.language || '').toLowerCase();
				var displayLang =
					savedLang === 'en' || savedLang === 'fr' || savedLang === 'ja'
						? savedLang
						: browserLang.startsWith('fr')
							? 'fr'
							: 'en';
				if (displayLang !== 'en') {
					document.documentElement.dataset.lang = displayLang;
				}
			} catch (e) {}
			// A page that lands already scrolled (a restored position) flags it
			// before hydration, so the Header hides its large top-of-page
			// wordmark rather than paint it over the content (Header.svelte).
			addEventListener(
				'scroll',
				function flagPrescrolled() {
					if (scrollY > 8) {
						document.documentElement.classList.add('is-prescrolled');
						removeEventListener('scroll', flagPrescrolled);
					}
				},
				{ passive: true }
			);
		</script>
		<!-- Per-page <meta name="description"> comes from each route's svelte:head -->
		<!-- Global design tokens and reset (bump ?v= whenever base.css changes) -->
		<link rel="stylesheet" href="%sveltekit.assets%/css/base.css?v=20261106a" />
		<!-- Norma VF — latest export (version in the filename). Renamed from
		     "Steiner"/"Asger", then "Atom", 2026-08-30/31 (product renames);
		     filename/version scheme unchanged. Declared under two family names
		     from the SAME file:
		     'Norma' (kept stable — most components still hardcode this) and
		     'Norma VF09' (versioned; --font-en/--font-ja below use this one,
		     so anything reading var(--font-en)'s computed value sees the
		     build number). Bump both the URL and the second name's suffix
		     together on every export. VF09 (2026-09-29): 'A' outline
		     refined (width change cascades to Aacute-type composites and to
		     parenleft/parenright, sized off cap width) — the only real change
		     vs VF08; kerning unchanged. ogonekcomb/baht remain excluded (still master-incompatible) — see
		     static/fonts/README.md. -->
		<style>
			@font-face {
				font-family: 'Norma';
				src: url('%sveltekit.assets%/fonts/Norma-VF09.woff2?v=20260929a') format('woff2-variations');
				font-weight: 1 950;
				font-style: normal;
				font-display: swap;
			}

			@font-face {
				font-family: 'Norma VF09';
				src: url('%sveltekit.assets%/fonts/Norma-VF09.woff2?v=20260929a') format('woff2-variations');
				font-weight: 1 950;
				font-style: normal;
				font-display: swap;
			}

			/* Mokuseki Sans (latest v08) — used by the home-page wordmark */
			@font-face {
				font-family: 'Mokuseki Sans';
				src: url('%sveltekit.assets%/fonts/MokusekiSans08-Regular.woff2?v=08') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}

			/* Maxica (TTT Maxica, 2026-11-01) — variable, wght 50 (Hair) – 950
			   (Black), drawn in Projects/brands/August/00_Typeface/Maxica/Glyphs/
			   Maxica.glyphs and built with Maxica/Export/build_maxica.py. Only the
			   characters drawn AND compatible in BOTH masters are in the file —
			   VF19 (2026-11-05): A–Z a–y, 51 letters, spacing rebuilt + 0.015em of tracking baked into Hair, open-sided letters tightened, class kerning; `a`, `e` and `n` carry their own intermediate masters (wght 550 / 650 / 650) — so everything else
			   falls through to the next face in the stack.
			   VF20 (2026-11-08): x-height 520 → 480, Hair 91% / Black 95% wide (capitals
			   100%), +0.02em of spacing baked in, kerning rescaled.
			   VF21 (same day): `a c e h n o s u x` (+ accented forms) redrawn; 17 accent
			   kerning pairs loosened (T / Y / Ý / Ÿ against à ã ä è ë š).
			   VF22 (same day): `a c d i L I n r s` (+ accented forms) redrawn, 6 accent pairs eased. */
			@font-face {
				font-family: 'Maxica';
				src: url('%sveltekit.assets%/fonts/Maxica-VF22.woff2?v=20261108c') format('woff2-variations');
				font-weight: 50 950;
				font-style: normal;
				font-display: swap;
			}

			/* Quad Sans (TTT Quad Sans, 2026-10-31) — one Regular, drawn from
			   Projects/brands/August/00_Typeface/Qutis/Quad.glyphs and built with
			   its Export/build_quad.py. Characters not drawn yet are left out of
			   the file, so they fall through to the next face in the stack. */
			@font-face {
				font-family: 'Quad Sans';
				src: url('%sveltekit.assets%/fonts/QuadSans-Regular.woff2?v=20261031') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}

			/* Quad Serif — named on the home page (2026-11-05) before it is drawn,
			   so its name is set in EB Garamond, the file the /opentype reference
			   already carries, as a stand-in. Swap the src when the real face
			   exists. */
			@font-face {
				font-family: 'Quad Serif';
				src: url('%sveltekit.assets%/fonts/otref-garamond.woff2') format('woff2');
				font-weight: 400 800;
				font-style: normal;
				font-display: swap;
			}

			/* Mokuseki Sans 01 (first cut) — the ANDERSEN logotype face */
			@font-face {
				font-family: 'Mokuseki Sans 01';
				src: url('%sveltekit.assets%/fonts/MokusekiSans01-Regular.woff2?v=01g') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}

			/* Ango (formerly Elio — renamed 2026-10-03) — now a real variable font
			   (2 masters: Hair 150 / Ultra 950, full wght range interpolated
			   between them). Used on the Ango typeface page's Type Tester and
			   the top-page A-Z specimen.
			   Early history (VF14-19, 2026-09-22/30): Ultra's axis moved
			   850→950 for a full 9-stop named scale; "yen"/"endash" shipped;
			   ongoing outline touch-ups. VF20 (2026-10-01): `s` refined further.
			   VF21 (same day): every glyph's advance width widened by 5 units
			   (UPM 1000) — default spacing now reads like `letter-spacing:
			   0.005em` baked in. VF22-24 (2026-10-02/04): `u`/`q`/`A`/`N`/`P`/
			   `b`/`d`/`s` refinements; VF23 is the first build carrying the
			   new name — the binary's own family/PostScript name say "Ango",
			   and the file was Elio-VF##.woff2 until VF21. VF25
			   (2026-10-06): `W`/`p` refined. **VF26** (2026-10-07): broad
			   outline refinement across A/N/T/W/c/d/e/g/h/i/m/o/p/r/v/w/y
			   (+ their accented composites), `quotesingle` and `cent`.
			   **VF27** (2026-10-11): 24 punctuation/symbol glyphs now ship
			   (! " # & * + / ; < = > ? [ \\ ] _ | © « ® ° » ’ “ ” ™) — the
			   Ultra layers that were missing were derived from Ultra's own
			   letters/bars; ^ ~ % (empty in both masters) are no longer
			   shipped as blanks, so Norma draws them. VF28 (2026-10-12):
			   outline refinement on B/I/K/O/P/q/one (+ their accented
			   composites). VF29-31 (2026-10-12/28): `s`, `c`/`q`/`t`/`cent`
			   refined and Q's Ultra paths re-ordered to match Hair (the
			   Q interpolation was twisted before); no coverage change.
			   VF34 (2026-11-06): ten weights on wght 50-950 (Hair master
			   moved 150→50 with its stem thinned 25→11; the Ultra master is
			   the Black stop) and the Tier 1 drafts ship — 234 characters.
			   VF35 (same day): `N` (both masters) and `Euro` redrawn.
			   VF36 (2026-11-07): `l` `m` `p` `q` (+ `thorn`) thinned to the
			   new Hair, Black `M` and `x` redrawn.
			   VF37 (same day): Black `d` redrawn (advance 551 → 568).
			   VF38 (same day): A–Z a–z re-spaced against a panel of eleven
			   geometric / humanist sans (round sides opened, straights evened
			   out, open sides tightened) and class kerning (143 class pairs).
			   VF39 (same day): `s` redrawn, Black acute/grave (+ accented
			   letters), period/comma, `d` `g` `x` redrawn; Y + è loosened.
			   VF40 (same day): `a` (+ accented), `l`, comma redrawn, Hair period.
			   VF41 (2026-11-08): capitals redrawn (S C E F G H M N O P R T U X Y Z,
			   Black A) and re-spaced; T + ä ë ê š loosened.
			   VF42 (same day): `U` (+ accented) and Black `M` redrawn.
			   Full history: static/fonts/README.md. */
			@font-face {
				font-family: 'Ango';
				src: url('%sveltekit.assets%/fonts/Ango-VF42.woff2?v=20261108b') format('woff2-variations');
				font-weight: 50 950;
				font-style: normal;
				font-display: swap;
			}

			/* Site-wide brand font: Ango (2026-09, at the user's request —
			   "基本はAngoがブランド書体"), falling back per glyph to Norma for
			   anything Ango hasn't drawn yet (its shipped VF is a subset while
			   Ultra catches up — see static/fonts/README.md). Norma is a sibling
			   face with near-identical proportions, so the per-glyph fallback
			   reads as one voice. Typeface pages still set themselves in their
			   own face, and the Header's small nav chrome stays in Norma, both
			   per the Figma frames. The versioned Norma name goes first in the
			   fallback chain — see the @font-face comment above. */
			:root {
				--font-en: 'Ango', 'Norma VF09', 'Norma', 'Helvetica Neue', Arial, sans-serif;
				--font-ja:
					'Ango', 'Norma VF09', 'Norma', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
				--font-ango: 'Ango', 'Norma VF09', 'Norma', 'Helvetica Neue', Arial, sans-serif;
				/* Norma on its own, for the places that deliberately keep it
				   (Header chrome, the buy flow — Ango's currency glyphs aren't
				   finished, and prices are the one place that would show). */
				--font-norma: 'Norma VF09', 'Norma', 'Helvetica Neue', Arial, sans-serif;
			}

			html,
			body {
				font-family: 'Ango', 'Norma', 'Helvetica Neue', Arial, sans-serif;
			}
		</style>

		<!-- Icons — the A of the Apres Guerre wordmark ($lib/data/logo.ts) in
		     white on the brand blue, as the home page's opening shows it (2026-10-31;
		     it was orange). SVG
		     first (scalable, and what modern browsers pick), PNG as the
		     fallback for browsers that don't support SVG favicons. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#ffffff" />

		<!-- Open Graph / Twitter (site-wide defaults; pages set their own <title>).
		     No og:url here — crawlers fall back to each page's own URL. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Apres Guerre" />
		<meta property="og:title" content="Apres Guerre — TTT Humorist" />
		<meta
			property="og:description"
			content="An independent type foundry. TTT Humorist — a nine-weight geometric humanist variable typeface, in development."
		/>
		<meta property="og:image" content="https://august.tf/og.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Apres Guerre — TTT Humorist" />
		<meta
			name="twitter:description"
			content="An independent type foundry. TTT Humorist — a nine-weight geometric humanist variable typeface, in development."
		/>
		<meta name="twitter:image" content="https://august.tf/og.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
