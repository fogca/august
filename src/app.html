<!doctype html>
<html lang="en" data-lang="en" data-theme="page">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Decide the display language before first paint (avoids a flash of the
		     wrong one). An explicit choice from this tab session (sessionStorage,
		     cleared on tab close) always wins; otherwise fall back to the
		     browser's own language. Mirrored in lib/state/lang.svelte.ts's
		     restore() — keep the two in sync. -->
		<script>
			try {
				var savedLang = sessionStorage.getItem('august-lang');
				var browserLang = (navigator.language || '').toLowerCase();
				var displayLang =
					savedLang === 'en' || savedLang === 'fr' || savedLang === 'de' || savedLang === 'es'
						? savedLang
						: browserLang.startsWith('fr')
							? 'fr'
							: browserLang.startsWith('de')
								? 'de'
								: browserLang.startsWith('es')
									? 'es'
									: 'en';
				if (displayLang !== 'en') {
					document.documentElement.dataset.lang = displayLang;
				}
			} catch (e) {}
		</script>
		<!-- Per-page <meta name="description"> comes from each route's svelte:head -->
		<!-- Global design tokens and reset (bump ?v= whenever base.css changes) -->
		<link rel="stylesheet" href="%sveltekit.assets%/css/base.css?v=20261002a" />
		<!-- Norma VF — latest export (version in the filename). Renamed from
		     "Steiner"/"Asger", then "Atom", 2026-08-30/31 (product renames);
		     filename/version scheme unchanged. Declared under two family names
		     from the SAME file:
		     'Norma' (kept stable — most components still hardcode this) and
		     'Norma VF09' (versioned; --font-en/--font-ja below use this one,
		     so anything reading var(--font-en)'s computed value sees the
		     build number). Bump both the URL and the second name's suffix
		     together on every export. VF09 (2026-09-29): 'A' outline
		     refined (width change cascades to Aacute-type composites and to
		     parenleft/parenright, sized off cap width) — the only real change
		     vs VF08; kerning unchanged. ogonekcomb/baht remain excluded (still master-incompatible) — see
		     static/fonts/README.md. -->
		<style>
			@font-face {
				font-family: 'Norma';
				src: url('%sveltekit.assets%/fonts/Norma-VF09.woff2?v=20260929a') format('woff2-variations');
				font-weight: 1 950;
				font-style: normal;
				font-display: swap;
			}

			@font-face {
				font-family: 'Norma VF09';
				src: url('%sveltekit.assets%/fonts/Norma-VF09.woff2?v=20260929a') format('woff2-variations');
				font-weight: 1 950;
				font-style: normal;
				font-display: swap;
			}

			/* Mokuseki Sans (latest v08) — used by the home-page wordmark */
			@font-face {
				font-family: 'Mokuseki Sans';
				src: url('%sveltekit.assets%/fonts/MokusekiSans08-Regular.woff2?v=08') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}

			/* Mokuseki Sans 01 (first cut) — the ANDERSEN logotype face */
			@font-face {
				font-family: 'Mokuseki Sans 01';
				src: url('%sveltekit.assets%/fonts/MokusekiSans01-Regular.woff2?v=01g') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}

			/* Elio — now a real variable font (2 masters: Hair 150 / Ultra 950,
			   full wght range interpolated between them). Used on the Elio
			   typeface page's Type Tester and the top-page A-Z specimen.
			   Early history (VF14-16, 2026-09-22/29): Ultra's axis moved
			   850→950 for a full 9-stop named scale; N/M/S/dollar outline
			   touch-ups and new kerning pairs. VF17 (2026-09-30): "yen" now
			   ships — Ultra's layer was missing its "Y" component reference
			   entirely; restored by re-referencing Ultra's own "Y" the same
			   way dollar/cent/euro already do. VF18 (same day): outline
			   refinement on G/K/R/f/g/t + a yen touch-up. VF19 (same day):
			   "endash" now ships too, plus outline refinement on e/eacute/
			   egrave/ecircumflex/edieresis/d/A/emdash/b/w/r/g/two/three.
			   **VF20** (2026-10-01): `s` refined further — no compatibility
			   change. Full history: static/fonts/README.md. */
			@font-face {
				font-family: 'Elio';
				src: url('%sveltekit.assets%/fonts/Elio-VF20.woff2?v=20261001a') format('woff2-variations');
				font-weight: 150 950;
				font-style: normal;
				font-display: swap;
			}

			/* Site-wide brand font: Elio (2026-09, at the user's request —
			   "基本はElioがブランド書体"), falling back per glyph to Norma for
			   anything Elio hasn't drawn yet (its shipped VF is a subset while
			   Ultra catches up — see static/fonts/README.md). Norma is a sibling
			   face with near-identical proportions, so the per-glyph fallback
			   reads as one voice. Typeface pages still set themselves in their
			   own face, and the Header's small nav chrome stays in Norma, both
			   per the Figma frames. The versioned Norma name goes first in the
			   fallback chain — see the @font-face comment above. */
			:root {
				--font-en: 'Elio', 'Norma VF09', 'Norma', 'Helvetica Neue', Arial, sans-serif;
				--font-ja:
					'Elio', 'Norma VF09', 'Norma', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
				--font-elio: 'Elio', 'Norma VF09', 'Norma', 'Helvetica Neue', Arial, sans-serif;
				/* Norma on its own, for the places that deliberately keep it
				   (Header chrome, the buy flow — Elio's currency glyphs aren't
				   finished, and prices are the one place that would show). */
				--font-norma: 'Norma VF09', 'Norma', 'Helvetica Neue', Arial, sans-serif;
			}

			html,
			body {
				font-family: 'Elio', 'Norma', 'Helvetica Neue', Arial, sans-serif;
			}
		</style>

		<!-- Icons — the A of the Apres Guerre wordmark ($lib/data/logo.ts) in
		     the brand blue on the home page's opening orange (2026-10). SVG
		     first (scalable, and what modern browsers pick), PNG as the
		     fallback for browsers that don't support SVG favicons. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#ffffff" />

		<!-- Open Graph / Twitter (site-wide defaults; pages set their own <title>).
		     No og:url here — crawlers fall back to each page's own URL. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Apres Guerre" />
		<meta property="og:title" content="Apres Guerre — Norma" />
		<meta
			property="og:description"
			content="An independent type foundry. Norma — a 20-weight neo-humanist variable typeface."
		/>
		<meta property="og:image" content="https://august.tf/og.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Apres Guerre — Norma" />
		<meta
			name="twitter:description"
			content="An independent type foundry. Norma — a 20-weight neo-humanist variable typeface."
		/>
		<meta name="twitter:image" content="https://august.tf/og.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
