<!doctype html>
<html lang="en" data-lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Decide the display language before first paint (avoids a flash of the
		     wrong one). An explicit choice from this tab session (sessionStorage,
		     cleared on tab close) always wins; otherwise fall back to the
		     browser's own language. Mirrored in lib/state/lang.svelte.ts's
		     restore() — keep the two in sync. -->
		<script>
			try {
				var savedLang = sessionStorage.getItem('august-lang');
				var displayLang =
					savedLang === 'en' || savedLang === 'da'
						? savedLang
						: (navigator.language || '').toLowerCase().startsWith('da')
							? 'da'
							: 'en';
				if (displayLang === 'da') {
					document.documentElement.dataset.lang = 'da';
				}
			} catch (e) {}
		</script>
		<!-- Per-page <meta name="description"> comes from each route's svelte:head -->
		<!-- Global design tokens and reset (bump ?v= whenever base.css changes) -->
		<link rel="stylesheet" href="%sveltekit.assets%/css/base.css?v=20260830a" />
		<!-- Atom VF — latest export (version in the filename). Renamed from
		     "Steiner" 2026-08-30 (product rename); filename/version scheme
		     unchanged. Declared under two family names from the SAME file:
		     'Atom' (kept stable — most components still hardcode this) and
		     'Atom VF75' (versioned; --font-en/--font-ja below use this one,
		     so anything reading var(--font-en)'s computed value sees the
		     build number). Bump both the URL and the second name's suffix
		     together on every export. -->
		<style>
			@font-face {
				font-family: 'Atom';
				src: url('%sveltekit.assets%/fonts/Atom-VF75.woff2?v=20260828f') format('woff2-variations');
				font-weight: 1 950;
				font-style: normal;
				font-display: swap;
			}

			@font-face {
				font-family: 'Atom VF75';
				src: url('%sveltekit.assets%/fonts/Atom-VF75.woff2?v=20260828f') format('woff2-variations');
				font-weight: 1 950;
				font-style: normal;
				font-display: swap;
			}

			/* Mokuseki Sans (latest v08) — used by the home-page wordmark */
			@font-face {
				font-family: 'Mokuseki Sans';
				src: url('%sveltekit.assets%/fonts/MokusekiSans08-Regular.woff2?v=08') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}

			/* Mokuseki Sans 01 (first cut) — the ANDERSEN logotype face */
			@font-face {
				font-family: 'Mokuseki Sans 01';
				src: url('%sveltekit.assets%/fonts/MokusekiSans01-Regular.woff2?v=01g') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}

			/* Site-wide font: Atom for all elements (chairman directive).
			   The versioned name goes first — see the @font-face comment above. */
			:root {
				--font-en: 'Atom VF75', 'Atom', 'Helvetica Neue', Arial, sans-serif;
				--font-ja: 'Atom VF75', 'Atom', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
			}

			html,
			body {
				font-family: 'Atom', 'Helvetica Neue', Arial, sans-serif;
			}
		</style>

		<!-- Icons -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#ffffff" />

		<!-- Open Graph / Twitter (site-wide defaults; pages set their own <title>).
		     No og:url here — crawlers fall back to each page's own URL. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="August Type Foundry" />
		<meta property="og:title" content="August Type Foundry — Atom" />
		<meta
			property="og:description"
			content="An independent type foundry from Tokyo. Atom — a 20-weight neo-humanist variable typeface."
		/>
		<!-- og.png itself likely has "Asger" baked into the image — regenerating
		     it is outside this rename's scope, flag separately. -->
		<meta property="og:image" content="https://august.tf/og.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="August Type Foundry — Atom" />
		<meta
			name="twitter:description"
			content="An independent type foundry from Tokyo. Atom — a 20-weight neo-humanist variable typeface."
		/>
		<meta name="twitter:image" content="https://august.tf/og.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
